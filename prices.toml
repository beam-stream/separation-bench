# Prices the report converts measured compute and billed minutes with. Every entry carries the date it
# was read and where from. A price without a source does not go in.

# No CPU rate card. The CPU arms ran on one desktop CPU, and the same work differs by more than
# 1.6x across CPU generations within a single provider's own fleet, so whichever card were chosen
# here would move the figure more than the model does. The report prints measured CPU-seconds per
# audio-second instead and leaves the arithmetic to a reader who knows their own rate.

[gpu.rtx3090]
# Single on-demand 3090. RunPod Community Cloud; TensorDock is $0.20, RunPod Secure $0.50.
usd_per_hour = 0.22
# How many streams a card holds is min(throughput, memory), and for half the models here it is
# memory. Board total; a real deployment loses a few hundred MB to context and fragmentation.
vram_mb = 24576
source = "https://www.runpod.io/pricing"
read = "2026-09-22"

# Per minute of INPUT audio unless the note says otherwise. Billing rules that change the arithmetic
# (per-target credits, rounding up, minimums) are what `note` is for.
[api.audioshake]
usd_per_minute = nan
note = "1.5 credits per minute per target (dialogue + residual = one target), rounded up to the minute; USD per credit not public"
source = "https://developer.audioshake.ai/billing"
read = "2026-09-22"

[api.gaudio-speech-hq]
usd_per_minute = 0.065
note = "gsep_speech_hq_v1, speech + others"
source = "https://www.gaudiolab.com/developers/resources/pricing"
read = "2026-09-22"

