[project]
name = "sepbench"
version = "0.1.0"
description = "Reproducible benchmark of speech/background separators"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "soundfile>=0.12",
    "soxr>=0.5",
    "pyloudnorm>=0.1.1",
    # fal's file upload is SDK-only; there is no documented REST endpoint to call instead.
    # Imported lazily, so only the fal-sam-audio arm needs it present.
    "fal-client>=0.5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
sepbench = "sepbench.cli:main"

[build-system]
# 1.27 is the first release that takes `license` as an SPDX expression (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
